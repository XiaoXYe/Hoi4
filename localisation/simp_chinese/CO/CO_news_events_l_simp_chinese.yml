 cnnews.114514.t:0 "debug专用事件"
 cnnews.114514.d:0 "debug专用事件"
 cnnews.114514.a:0 "debug专用事件"
 cnnews.1.t:0 "新冠疫情爆发"
 cnnews.1.d:0 "从在武汉被首次检测到并被归类为传染病后，新型冠状病毒在短短数十天内席卷了整个中国，城市里随处可见发热咳嗽的患者。各地政府纷纷呼吁人们注意生活卫生，尽量呆在家中不要随意外出。至于是否采用更加严格的防疫措施，将由各地政府进一步决定"
 cnnews.1.a:0 "幸亏这是模拟，不是现实"
 cnnews.2.t:0 "中国滑雪队的新面孔"
 cnnews.2.d:0 "出生在美国的中国国家队选手的谷爱凌抵达中国后备受中央关注，她被接往河北崇礼备战2022年北京冬奥会。谷爱凌在不久前的洛桑青冬奥会上首次亮相，不仅拿下自由式滑雪女子大跳台金牌，还获得了U型场地技巧金牌和坡面障碍技巧银牌。她的身份以及独立女性的人设在网络热度居高不下，被粉丝们称为体育界的冰雪女王！"
 cnnews.2.a:0 "所以她是中国人吗？"
 cnnews.3.t:0 "东北协约的成立"
 cnnews.3.d:0 "辽宁、吉林和黑龙江这三个东北地区的前共和国长子都渴望着复仇。如今，他们出现在了同一张谈判桌上并且宣布成立东北协约。这个组织不止是一个关于东北文化认同的组织，也是这些国家之间的军事联盟，他们希望能通过这种方式夺取他们“祖先的土地”。\n\n而对于内蒙古对蒙东的占领来说，这则是一个巨大的打击。不过事情接下来能否开花结果还要看其他成员的反应。"
 cnnews.3.a:0 "共和国长子要回来了"
 cnnews.4.t:0 "东北收复战争"
 cnnews.4.d:0 "在1979年，中共中央政府决定将蒙东划归给内蒙古，这让内蒙古成为了一个横跨东北，华北和西北的国家。而像辽宁、吉林、黑龙江这些被国家发展政策抛弃的失败者们则不得不吞下苦果。\n\n这样的紧张局势最终导致了东北协约的成立。而现在，他们正式对内蒙古宣战了。东北自解放以来再次陷入战火。对于[NMG.GetLeader]来说，他究竟是会力挽狂澜还是见证他的土地被夺去呢？"
 cnnews.4.a:0 "要警惕东北的振兴"
 cnnews.5.t:0 "东北宣布统一"
 cnnews.5.d:0 "从哈尔滨到长春再到沈阳，机械巨兽在土地上奔跑，在工厂里咆哮。黑吉辽三省又一次坚定团结的站在了一起，沈阳故宫前升起满洲龙旗，宣告东北统一，[From.GetLeader]所代表的文化会导致东北的政权究竟以一个什么形式存在，人们仍有疑问。\n\n但在历史课上，孩子们自发的翻着历史课本查找着东北统一后的历史，往前翻，是溥仪的伪满洲，再往前翻，是张作霖的奉系，再往前翻，是皇太极的大清..."
 cnnews.5.a:0 "求求孩子别再翻了"
 cnnews.6.t:0 "理塘宣布独立"
 cnnews.6.d:0 "本是四川模范旅游自治区的甘孜州，在新冠疫情爆发后经济崩溃并陷入了动乱。\n\n如今，甘孜州理塘的民族主义者和文化保守派联合在理塘丁真的旗下，共同对抗四川政府。理塘丁真宣布了理塘的独立并谴责了四川政府对甘孜藏族自治州许诺的优待政策都是空头支票，而在危机到来时不管不顾，他还强调了藏族人民会团结起来，用自己的力量在中国打下一片天地。\n\n四川政府把理塘描述为一群不知天高地厚的牧民，天天骑个b马到处游手好闲，四川的警备力量很快就能将他们镇压，而大多数观察者都认同这一说法。"
 cnnews.6.a:0 "当看个乐子了"
 cnnews.7.t:0 "理塘起义胜利"
 cnnews.7.d:0 "四川政府显然低估了理塘人民的决心，也错判了四川人民的文化倾向。在理塘军队的猛烈攻势下，四川各地的军备力量溃不成军，甚至有的部队未交战就缴械投降，并声称自己是丁真的忠实粉丝。四川政府终于彻底崩溃，理塘宣布接管四川政权。\n\n这个国家的未来还不明确，但可以肯定的是丁真所代表的藏族保守文化已经统治了四川，关于他们是否会满足于四川的土地，中国的社会观察者都在激烈争论。"
 cnnews.7.a:0 "理塘兴，丁真王！"
 cnnews.8.t:0 "川渝合并"
 cnnews.8.d:0 "在理塘巩固了自身在四川的政权后，理塘军跨越了重庆边境，随即控制了重庆全境。没有出现发生交火的报道，并且理塘士兵在入城时甚至还受到了城市中人群的热烈欢呼。\n\n在面向洪崖洞的大批聚集群众发表的演说当中，丁真宣布川渝实现合并，重庆整个地区将并入四川：\n“作为四川人民所生活的最古老的东方省份，从现在起，重庆将成为捍卫理塘的崭新堡垒！”"
 cnnews.8.a:0 "也不是没有道理..."
 cnnews.9.t:0 "三峡危机"
 cnnews.9.d:0 "[LIT.GetName]需要湖北的三峡地区，和慕尼黑协定不同的是，那里并没有居住着相当多的藏族人，因此局势愈演愈烈。\n\n在一场于宜昌举行的峰会上，[LIT.GetName]和湖北争取寻找一个所谓的“三峡危机”的外交解决方案。[LIT.GetName]谴责湖北是新冠疫情的发源地，没有果断采取有效措施导致全中国陷入公共卫生的危机，[LIT.GetLeader]表示[LIT.GetName]在应对危机的政策显然有着较高的优势，因此想要接管三峡地区美其名曰拯救人民。湖北本不可能答应这一要求，但由于理塘的日益强大和内部公共卫生危机确实还没有缓解。双方最终达成了一个理塘兼并三峡地区的协议，但将不在湖北追求更进一步的领土要求."
 cnnews.9.a:0 "那么今年不会打仗了..."
 cnnews.10.t:0 "阿坝协定"
 cnnews.10.d:0 "[LIT.GetName]在三峡取得胜利后，还真没有继续吞并湖北全境，而是专头把目光放在了北方。[LIT.GetName]军队已经穿越蜀道进入了陇南和汉中，表面上是为了推行他们“优秀”的防疫政策，继续那套说辞。\n\n甘肃和陕西政府吓坏了，他们的军队、工业和经济发展自然远不如[LIT.GetName]，甚至不如失去了三峡的湖北，因此三方迅速在阿坝达成了协定，签订条约将陇南和陕南地区割让给了[LIT.GetName]。一如在三峡危机中表现的那样，[LIT.GetLeader]表示[LIT.GetName]不会在陕甘宁地区追求进一步的扩张。\n\n中国的观察家们一直在质疑[LIT.GetName]遵守条约的可能性，但有少数专家指出，[LIT.GetName]一定会遵守条约，因为他们的下个目标一定是东方。"
 cnnews.10.a:0 "通向中原的路好像打开了"
 cnnews.11.t:0 "西藏加入理塘意志"
 cnnews.11.d:0 "西藏和川西都是藏族人民的老牌自治区，而当[LIT.GetName]这一新藏族文化的风向标出现在中华大地上后，双方在外交上的交好就自然是水到渠成的。\n\n西藏和[LIT.GetName]正在谈判一个协议，将“保护藏族人民的利益”。双方在一些细节上还有争执，但可以肯定的是，西藏将会加入[LIT.GetName]领导的理塘意志阵营，他们将在中国西部发挥巨大的影响力。"
 cnnews.11.a:0 "为什么不叫纯真联盟啊？"
 cnnews.12.t:0 "理塘宣布战胜疫情"
 cnnews.12.d:0 "理塘文化领袖[From.GetLeader]近日宣布，新冠病毒在理塘已不是威胁，生产生活已完全恢复。\n\n理塘并没有采取严格的防疫措施，甚至没有进行疫苗的研发和接种，[From.GetLeader]宣称理塘人民追求着人、动物与机器和谐发展的方式，并进行了国家的干预。他还声称，愿意把这种政策推行给理塘的邻居，解放饱受苦难和病痛折磨的人们。"
 cnnews.12.a:0 "这合理吗？"
 cnnews.13.t:0 "河南拒绝理塘的最后通牒"
 cnnews.13.d:0 "考虑这些要求，似乎一切都不可避免。\n\n理塘要求河南允许理塘军队驻扎并进行防疫管理，并派遣全权代表前往四川商讨其他条款。[HEN.GetLeader]指出，[LIT.GetNameDef]近期的举动表明理塘的目的很明显不是帮助防疫。\n\n理塘和河南的军队都已做好战斗的准备，边境冲突的报告大量传来。中国即将再次陷入战火之中。"
 cnnews.13.a:0 "形势万分严峻"
 cnnews.14.t:0 "第二次中国内战"
 cnnews.14.d:0 "中国持续了70年的和平再一次被打破，第二次中国内战爆发于中原和西川之间——山河四省对阵理塘帝国。与共产党的红色中国对阵蒋氏的威权中国不同，第二次中国内战不光是意识形态上的冲突，还是[BEJ.GetRulingIdeology]文化和[LIT.GetRulingIdeology]文化的冲突。理塘也与腐败不堪的蒋氏王朝不同，双方的民族凝聚力和文化凝聚力注定这场战争不会像第一次中国内战那样迅速结束。\n\n与此中原地区陷入殊死搏斗之时，东北的抽象派，东南的大公司资本，甚至上一次内战的失败者，如今处于台湾的文化领袖都正以充满热切渴望的眼神打量着曾属于他们的领土，当今局势可能对他们有利可图。\n\n同时，云南、安徽、西北地区的其它势力也都开始积极备战，为发起他们自己的战争做好准备。"
 cnnews.14.a:0 "大吉大利，今晚吃鸡！"
 cnnews.15.t:0 "河南水灾"
 cnnews.15.d:0 "中国郑州——7月20日，在中国有史以来降雨量最大的一个小时里，雨水像一座几英里宽的瀑布在郑州市上空倾泻而下，造成至少300人死亡，其中14人在地铁隧道中溺水身亡。被困在郑州5号线列车上的乘客说：“当时我的感觉就是等死，你不知道到底怎么死，是窒息而死，还是被水泡死。”\n\n更可怕的是，5号线的14人死亡只是这场灾难的一部分。城市内涝、河流洪水、山洪滑坡，河南该轮暴雨引发的洪涝和次生灾害共计造成河南省1,478.6万人受灾，直接经济损失1200.6亿元。一些评论家指出，郑州市有关部门虽已投入到积极救灾的过程中，但其对此次灾害负有的直接责任无可推脱。"
 cnnews.15.a:0 "为河南祈福"
 cnnews.16.t:0 "丁真加冕理塘皇帝"
 cnnews.16.d:0 "今天，丁真在理塘举行了盛大的加冕仪式，宣布理塘帝国的成立，自己加冕为理塘皇帝，这一举动震惊了中国。这意味着丁真成为自溥仪和袁世凯后，中国时隔近一个世纪的又一位皇帝。\n\n丁真在击败了四川的资本，赢得权力斗争后跨出了如此激进的一步，令他的处境十分微妙，因为经过几十年共和国的洗礼，帝制在中国人民已没有太多的影响力，更何况一位藏人皇帝。但丁真能否通过自身极限的个人魅力，来巩固自己的政权，找到自己的盟友，将他所代表的文化扩张到全中国，仍是一个疑问。在许多人开来，如此一个戏剧性的政权的灭亡只是时间问题，除非这个世界不太正常..."
 cnnews.16.a:0 "藏人皇帝有年号吗？"
 cnnews.17.t:0 "铁幕"
 cnnews.17.d:0 "理塘在和东北的合作下赢得了第二次中国内战，双方表面上均遵守葫芦岛会议的要求移交了占领区，而暗地里双方仍动作不断。理塘皇帝丁真昨日在洛阳发表了被称为铁幕言说的演讲：\n从东戈壁的乌兰察布到黄海海边的青岛，一幅横贯中国大陆的铁幕已经降落下来。在这条线的后面，坐落着晋鲁与燕云古国的都城。太原、北京、济南、大同、常山、天津和秦皇岛——所有这些饱经沧桑的城市及其居民无一不处在东北帝国的势力范围之内，不仅以这种或那种形式屈服于东北帝国的势力影响，而且还受到沈阳日益增强的高压控制。只有大连，放射着它不朽的光辉，在理塘、西藏、东南诸国每一个人的眼下，自由地决定它的前途。"
 cnnews.17.a:0 "和平似乎还很遥远..."
 cnnews.18.t:0 "抽象天国诞生"
 cnnews.18.d:0 "四川的抽象文化在理塘的打击下分崩离析，但和李赣等投降派不同，以孙笑川这位抽象皇帝为领袖的主战派在跨越了重重封锁后逃到了云南，起初他们只是在云南培育反抗势力，传播抽象文化，但显然这位皇帝自己都低估了抽象文化的影响力。\n\n在很短的一段时间后，抽象文化迅速在云南枝繁叶茂，孙笑川成为了云南的文化领袖，宣布建立抽象天国。可以预见的是，云南将成为全中国抽象文化的文化中心。"
 cnnews.18.a:0 "抽象文化的敌后根据地？"
 cnnews.19.t:0 "进步主义席卷北京"
 cnnews.19.d:0 "从北京传来了令人震惊的消息，谷爱凌代表的进步主义文化拿下了北京的话语权。\n\n谷爱凌对人民承诺将放松疫情管制，在中国推行进步主义改革，这一举动对渐进主义不满的人民有着很大的吸引力，尤其是在抖音微博等文化平台的加速扩散下，谷爱凌宣扬的包容和自由获得了大量的支持。进步主义的文化能否深深扎根中国，就看谷爱凌下一步会如何操作了。"
 cnnews.19.a:0 "冲冲冲！进步！冲！"
 cnnews.20.t:0 "山河永固"
 cnnews.20.d:0 "为了应对理塘意志日益增长的扩张倾向以及在中国谋取更大的发展利益，传说中的山河四省终于坐在了一起，商量经济和军事上的合作。\n\n完成了京津冀一体化的河北自然而然坐在首位，在几周的激烈讨论后，山西和山东完全接受了河北的条件，加入山河同盟。河南则有所保留，在经济上成为山河同盟成员，而在军事上选择保留自主，但这也代表着他们将独自面对与理塘的边境线。但也有河南学者表示，真到战争爆发那一天，河南在军事上加入山河同盟不可避免。"
 cnnews.20.a:0 "乱世兵家必争地，盛世冤种四兄弟"
 cnnews.21.t:0 "理塘对阵东北"
 cnnews.21.d:0 "第二次中国内战并未因中原[BEJ.GetRulingIdeology]的分崩离析而落下帷幕，理塘和东北的文化冲突在铁幕之下暗流涌动。而如今，理塘再不能容忍中华大地上有另一种文化势力与其分享荣光\n\n这是让2023年更为黯然失色的战争，无数的坦克和火炮再次在陆地上轰鸣，无数的飞机再次在天空投下令家庭绝望的死亡宣告。理塘和东北均已再次动员，中国人民再一次为自己信奉的文化所奋斗，或者说，再一次沦为文化的牺牲品"
 cnnews.21.a:0 "这是终局之战吗？"
 cnnews.22.t:0 "蒙东脱离内蒙古"
 cnnews.22.d:0 "在面对东北协约的惨败后，内蒙古在蒙东的控制力分崩离析。东北协约在夺取了东四盟后，锡林郭勒盟的人民也对内蒙古文化失去了信心，转而想要投靠日益强大的东北势力，因此成立了蒙东共和国并向辽宁申去了橄榄枝。蒙东虽然目前作为东北的傀儡，但其仍保留了东四盟的法理宣称，观察员们认为蒙东的未来仍有争议，他们是会安心在东北势力范围内发展，还是会伺机而动夺回自己的荣耀？"
 cnnews.22.a:0 "东北的势力再一次扩大了"
 cnnews.23.t:0 "北京宣布新冠疫苗研发成功"
 cnnews.23.d:0 "今日，北京政府宣布在数百名科学家的不懈努力下，其新冠疫苗已经通过了I、II期临床试验，受试者全部完成2针次接种。揭盲结果显示：疫苗接种后安全性好、无一例严重不良反应。\n\n北京政府高度赞扬了人民和政府相互信任、共克时坚的精神，北京人民将在[BEJ.GetRulingIdeology]的道路上越走越远。同时，政府承诺疫苗将作为全国公共产品，但会对疫苗的发放方式展开讨论。"
 cnnews.23.a:0 "人民得救了！"
 cnnews.23.b:0 "我们不能听信进步主义的糖衣炮弹"
 cnnews.24.t:0 "理塘丁真火爆中国"
 cnnews.24.d:0 "偶然闯入摄影师胡波镜头的丁真，因其纯粹清澈的微笑最终在抖音上发酵，不到两小时，播放量就突破1000万。中国网友对丁真的喜爱复制了饭圈的狂热，霸榜热搜。丁真的家乡理塘一夜出圈，搜索指数一周爆涨620%。业内预测，理塘或成2020年旅行黑马目的地。社会观察员说，丁真的爆红是一个开始，而这一现象级互联网事件，更是为网红效应赋能实业经济发展带来了可能。在丁真“触网”过后，或许将有更多的“丁真”诞生，在互联网时代下成为星火，在地大物博的中国燎原。"
 cnnews.24.a:0 "我想留在理塘，骑着我的小马，翻山越岭"
 cnnews.25.t:0 "北京宣布战胜疫情"
 cnnews.25.d:0 "北京文化领袖[From.GetLeader]近日宣布，新冠病毒在北京已彻底清零，北京人民的生产生活已完全恢复。\n\n北京政府通过贯彻[BEJ.GetRulingIdeology]的政策，同时有条不紊的进行疫苗的研发，终于成功地化解了这次公共卫生安全的危机。[From.GetLeader]声称这是属于北京人民的胜利，也是[BEJ.GetRulingIdeology]文化的胜利。\n\n中国其余地区的文化领袖也在积极的向北京靠拢，争取优先拿到北京的疫苗，以挽救自身的人民。"
 cnnews.25.a:0 "对于中国人民来说，这是件好事"
 cnnews.26.t:0 "京津冀一体化"
 cnnews.26.d:0 "京津冀地区迎来了历史性变革，三地正式合并为[BEJ.GetName]。\n\n[BEJ.GetName]的成立极大的促进了区域内资源的优化配置，北京大兴机场为区域枢纽的作用进一步加强，如今北京的空军力量可以覆盖整个中原。北京的高科技产业、天津的先进制造业、河北的现代服务业实现了更加紧密的协同发展，产业链和供应链更加完善。同时，疫苗等医疗资源实现了更加高效的共享，河北和天津等地难以管制的疫情也即将宣告结束。可以预见的是，[BEJ.GetName]以及[BEJ.GetRulingIdeology]文化的影响力将在中国迅速的扩大，成为不可忽视的存在。"
 cnnews.26.a:0 "[BEJ.GetRulingIdeology]文化的又一胜利"
 cnnews.27.t:0 "东北加入第二次中国内战"
 cnnews.27.d:0 "正如诸多社会观察者预料的那样，东北终于下定决心对山河同盟宣战，加入了第二次中国内战。\n\n如今的东北走出了落寞的共和国长子的阴影，并找到了属于自己的道路。理塘意志和山河同盟激战正酣，东北自然不会白白错失这一良机。从长城到山海关，漫山遍野的炮声和机器的轰鸣声象征着东北军队的强大实力，也象征着东北人民数百年来对入关的渴望和执着。\n\n对于山河同盟是否能扭转因东北宣战而陷入的南北方两线作战的被动局面，许多人持悲观态度。"
 cnnews.27.a:0 "一如四百年前"
 cnnews.28.t:0 "大连独立"
 cnnews.28.d:0 "北方传来了惊人的消息，大连宣布从辽宁独立。自2020年大连疫情出现超级传播后，辽宁在大连执行了错误的防疫政策，引起了大连人民的愤怒，进而发展成了武装冲突。看似强大的辽宁军队执行了错误的进攻方式，导致被大连军队打的溃不成军，这一错上加错铸成了如今无法发挥的局面，辽宁正式失去了大连这一战略要地。\n\n大连在新中国成立后是东北乃至全中国最发达的城市，但由于战略重心南移以及某个文化领袖的关系，大连的地位和经济一落千丈。有趣的是，大连的文化一直很多元，这与其曾被沙俄、日本、苏联控制，也与闯关东时期到来的大量的山东移民有关。至于大连未来会选择什么道路，我们会持续观察。"
 cnnews.28.a:0 "北方明珠要回来了？"
 cnnews.29.t:0 "山河同盟战败"
 cnnews.29.d:0 "正如部分观察家所预料的那样，陷入双线作战的山河同盟在理塘和东北的强大攻势下土崩瓦解，理塘军队大摇大摆地开入了中原，这对于反对[LIT.GetLeader]的人来说无疑是天大的噩耗。\n\n和平重返中原，但注定不会长久，理塘似乎在中国已经不可阻挡，其下一步必将把目光放在统一全中国上。[LIT.GetLeader]的反对者们把希望寄托在了东北身上，这片黑土地如今成为了反[LIT.GetLeader]的桥头堡，但在理塘强大的军事实力威慑下，这一桥头堡又能维持多久呢？但也有部分观察者认为，虽然[LIT.GetName]如日中天，但东北依靠强大的工业基础和地理优势，在未来对抗理塘的表现也会可圈可点。\n\n至少大家都认同的是，战争仍未结束。"
 cnnews.29.a:0 "拭目以待"

 cnnews.20241111.t:0 "珠海发生恶性驾车撞人案件"
 cnnews.20241111.d:0 "11月11日晚间，珠海市香洲区体育中心发生了一起驾车撞人案。一名62岁的樊姓男子驾驶小型越野车冲入全民健身广场健走步道，无差别撞击人群，随后试图驾车逃离现场。据警方通报，此次事件已导致35人死亡，43人受伤，成为近年来中国大陆最严重的暴力袭击事件之一。肇事者樊某因对离婚财产分割结果不满实施报复性犯罪，案发后持刀自伤，现已被警方立案侦查并刑事拘留。\n\n事件引发社会各界强烈关注。珠海市相关负责人员第一时间成立应急工作组，组织伤员救治和善后处理。事发场地珠海市体育中心暂停开放。官方表示，将全力保障伤员救治并严厉打击类似恶性暴力犯罪。"
 cnnews.20241111.a:0 "如此暴行令人愤慨"
 cnnews.20241112.t:0 "李子柒正式回归"
 cnnews.20241112.d:0 "11月12日，知名网红李子柒在停更三年后，发布了以中国非物质文化遗产“漆器”为主题的新视频。这部作品名为《紫气东来》，展示了漆器的制作工艺，寓意吉祥。视频一经发布便引发热议，全网播放量在短时间内突破亿次，李子柒相关话题迅速登上热搜榜首。\n\n在停更期间，李子柒走访了20多个省份，拜访了上百位非遗传承人，深入学习中国传统文化。她表示，未来将专注于非遗文化的传播，希望通过作品让更多人了解并关注中国传统技艺。此次回归引发国内观察员热议，李子柒是否可以代表中国的复古主义文化？这种爆火是否意味着复古主义者即将有所行动？"
 cnnews.20241112.a:0 "无论如何，传统文化因她的回归而焕发新生！"
 cnnews.20241204.t:0 "琼瑶女士逝世"
 cnnews.20241204.d:0 "2024年12月4日下午，华语文学界著名作家琼瑶在台湾新北市家中去世，享年86岁。据家属透露，琼瑶女士在生前留下遗书，表达了对生命的感悟和选择以自主方式离世的心愿。\n\n琼瑶，本名陈喆，1938年出生于四川成都，以言情小说闻名，代表作包括《窗外》《一帘幽梦》和《还珠格格》。她的作品曾多次改编为影视剧，感动了几代读者与观众。琼瑶女士的遗书写道：“我是‘火花’，我已尽力燃烧过。如今，当火焰将熄之前，我选择这种方式，翩然归去。”\n\n她的去世引发社会各界广泛悼念。作为华语文学界的重要人物，琼瑶的作品深刻影响了文学和影视领域，为中国的爱情文化增添了浓墨重彩的一笔。"
 cnnews.20241204.a:0 "她用一生书写了爱情的美好与力量。"
 