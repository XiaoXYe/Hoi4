 guangdong.20241111.t:0 "珠海发生恶性驾车撞人案件"
 guangdong.20241111.d:0 "11月11日晚间，珠海市香洲区体育中心发生了一起驾车撞人案。一名62岁的樊姓男子驾驶小型越野车冲入全民健身广场健走步道，无差别撞击人群，随后试图驾车逃离现场。据警方通报，此次事件已导致35人死亡，43人受伤，成为近年来中国大陆最严重的暴力袭击事件之一。肇事者樊某因对离婚财产分割结果不满实施报复性犯罪，案发后持刀自伤，现已被警方立案侦查并刑事拘留。\n\n事件引发社会各界强烈关注。珠海市相关负责人员第一时间成立应急工作组，组织伤员救治和善后处理。事发场地珠海市体育中心暂停开放。官方表示，将全力保障伤员救治并严厉打击类似恶性暴力犯罪。"
 guangdong.20241111.a:0 "如此暴行令人愤慨"