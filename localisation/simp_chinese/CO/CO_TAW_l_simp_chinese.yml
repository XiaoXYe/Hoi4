 taiwan.20241204.t:0 "琼瑶女士逝世"
 taiwan.20241204.d:0 "2024年12月4日下午，华语文学界著名作家琼瑶在台湾新北市家中去世，享年86岁。据家属透露，琼瑶女士在生前留下遗书，表达了对生命的感悟和选择以自主方式离世的心愿。\n\n琼瑶，本名陈喆，1938年出生于四川成都，以言情小说闻名，代表作包括《窗外》《一帘幽梦》和《还珠格格》。她的作品曾多次改编为影视剧，感动了几代读者与观众。琼瑶女士的遗书写道：“我是‘火花’，我已尽力燃烧过。如今，当火焰将熄之前，我选择这种方式，翩然归去。”\n\n她的去世引发社会各界广泛悼念。作为华语文学界的重要人物，琼瑶的作品深刻影响了文学和影视领域，为中国的爱情文化增添了浓墨重彩的一笔。"
 taiwan.20241204.a:0 "她用一生书写了爱情的美好与力量。"